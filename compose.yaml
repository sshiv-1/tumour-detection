services:

  backend:
    build:
      context: ./backend

    container_name: brain-tumor-backend

    ports:
      - "8000:8000"

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  frontend:
    build:
      context: ./frontend

      args:
        VITE_API_URL: http://localhost:8000

    container_name: brain-tumor-frontend

    ports:
      - "5173:80"

    depends_on:
      backend:
        condition: service_healthy